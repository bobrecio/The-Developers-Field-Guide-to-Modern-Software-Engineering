# version 1 of our Docker file.

services:
  python-app:
    build:
      context: .
    container_name: python-app
    ports:
      - "5000:5000" 
    volumes:
      - ./app:/app  # Mount local app directory
    networks:
      - app-network
    depends_on:
      - mysql  # Ensure MySQL starts before Python app

  mysql:
    image: mysql:8.4.3
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exampledb
      MYSQL_USER: exampleuser
      MYSQL_PASSWORD: examplepass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql  # Persist MySQL data
    networks:
      - app-network

  adminer:
    image: adminer
    container_name: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - app-network

volumes:
  mysql-data:  # Define named volume for MySQL persistence

networks:
  app-network:
    driver: bridge
